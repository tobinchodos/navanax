<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>Navanax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=19">
</head>
<body>
<main class="phone">
  <header><span class="mark">Navanax</span><span id="me"></span></header>
  <section class="view" id="view"><p class="center">Loading…</p></section>
</main>
<script>setTimeout(()=>{const b=document.getElementById("view");if(b&&/^\s*Loading/.test(b.textContent))b.innerHTML='<p class="center msg">Still loading. <a href="" style="color:inherit">Tap to reload</a>.</p>'},12000)</script>
<script type="module">
addEventListener("unhandledrejection", (e) => { const m = String(e.reason?.message || e.reason); const box = document.getElementById("view"); if (box && /loading/i.test(box.textContent)) box.innerHTML = `<p class="center">Can't connect.<br><small>${m.replace(/</g, "&lt;")}</small></p>`; });
import { configured, connect, QUESTIONS, HINT, RULES, PASSWORD_NOTE, PASSWORD_SHA256, sha256, esc, parseNum, fmtNum, seatsSVG, scoreboard, ref, onValue, set, push } from "./common.js?v=12";
const view = document.getElementById("view");
const meEl = document.getElementById("me");
const store = { get(k) { try { return localStorage.getItem(k); } catch { return null; } }, set(k, v) { try { localStorage.setItem(k, v); } catch {} } };

if (!configured) {
  view.innerHTML = `<p class="center">Not open yet.</p>`;
} else {
  const { db, uid } = await connect();
  let state = null, players = {}, answers = {}, unlocked = store.get("unlocked") === "1";
  let shown = "", busy = false;    // true while typing, so live updates don't wipe the input
  let editing = false;


  function render() {
    if (!state) return;
    const me = players[uid];
    meEl.textContent = me ? me.name : "";
    const Q = QUESTIONS[state.q];
    const mine = answers[state.q]?.[uid]?.text;
    const live = (state.phase === "question" || state.phase === "reveal") && Q;
    const key = !unlocked && !me ? "login" : !me ? "name"
      : live ? `${state.phase}${state.q}:${state.phase === "question" && (!mine || editing) ? "form" : "sent"}` : state.phase;
    if (key === shown && (busy || key.endsWith("form"))) return;
    shown = key;
    busy = false;

    if (key === "login") return loginView();
    if (key === "name") return nameView();
    if (live) {
      const head = `<div class="label">${state.q + 1} / ${QUESTIONS.length}</div><h2>${esc(Q.q)}</h2>`
        + (Q.note ? `<p>${esc(Q.note)}</p>` : "")
        + (Q.image ? `<img class="qimg ${Q.color ? "color" : ""}" src="${esc(Q.image)}" alt="" onerror="this.remove()">` : "")
        + (Q.figure === "seats" ? seatsSVG() : "")
        + (Q.quote ? `<blockquote>${esc(Q.quote.text)}<cite>${esc(Q.quote.cite)}</cite></blockquote>` : "");
      if (key.endsWith("sent")) {
        view.innerHTML = head + (mine ? `<div class="sent">${esc(mine)}</div>` : "")
          + (state.phase === "question" ? `<button class="ghost" id="edit">Change answer</button>` : `<p>Answers are closed. Look up.</p>`);
        const b = document.getElementById("edit");
        if (b) b.onclick = () => { editing = true; render(); };
        return;
      }
      if (Q.type === "choice") {
        view.innerHTML = head + `<div class="choices ${Q.options.length > 2 ? "stack" : ""}">${Q.options.map((o) => `<button class="choice ${mine === o ? "on" : ""}" data-o="${esc(o)}">${esc(o)}</button>`).join("")}</div><p class="err" id="msg"></p>`;
        view.querySelectorAll(".choice").forEach((b) => b.onclick = async () => {
          view.querySelectorAll(".choice").forEach((x) => x.disabled = true);
          try { await set(ref(db, `answers/${state.q}/${uid}`), { text: b.dataset.o, t: Date.now() }); editing = false; shown = ""; render(); }
          catch { document.getElementById("msg").textContent = "Didn't go through. Answers may be closed."; view.querySelectorAll(".choice").forEach((x) => x.disabled = false); }
        });
        return;
      }
      const num = Q.type === "number";
      view.innerHTML = head + `<form class="field" id="f">`
        + (num ? `<input id="a" ${Q.range || Q.whole ? 'inputmode="numeric"' : Q.unit === "%" || Q.scale === "log" ? 'inputmode="text"' : 'inputmode="decimal"'} autocomplete="off" placeholder="${Q.scale === "log" ? "e.g. 3 million, 4e12" : Q.range ? `${Q.range[0]} to ${Q.range[1]}` : Q.unit === "%" ? "e.g. 8 or -3" : "Number"}" value="${esc(mine || "")}">`
               : `<textarea id="a" maxlength="280" placeholder="Your answer">${esc(mine || "")}</textarea>`)
        + `<p class="${num ? "preview" : "err"}" id="msg"></p><button class="primary" id="go">Send</button></form>`;
      const f = document.getElementById("f"), a = document.getElementById("a"), msg = document.getElementById("msg");
      a.oninput = () => {
        busy = true;
        if (num && Q.scale === "log") { const v = parseNum(a.value); msg.textContent = a.value.trim() && isFinite(v) ? "= " + fmtNum(v) : ""; }
      };
      f.onsubmit = async (e) => {
        e.preventDefault();
        const text = a.value.trim().slice(0, 280);
        if (!text) return;
        if (num && !isFinite(parseNum(text))) { msg.textContent = "Enter a number."; return; }
        if (num && Q.whole && !(Number.isInteger(parseNum(text)) && parseNum(text) >= 0)) { msg.textContent = "Enter a whole number."; return; }
        if (num && Q.range && (parseNum(text) < Q.range[0] || parseNum(text) > Q.range[1])) { msg.textContent = `Enter ${Q.range[0]} to ${Q.range[1]}.`; return; }
        document.getElementById("go").disabled = true;
        try { await set(ref(db, `answers/${state.q}/${uid}`), { text, t: Date.now() }); editing = false; busy = false; shown = ""; render(); }
        catch { msg.textContent = "Didn't go through. Answers may be closed."; document.getElementById("go").disabled = false; }
      };
      return;
    }
    if (state.phase === "scores" || state.phase === "end") {
      const rows = scoreboard(QUESTIONS, state, players, answers);
      const i = rows.findIndex((r) => r.id === uid), pts = rows[i]?.pts ?? 0;
      view.innerHTML = `<div class="center"><div class="label">Your score</div><h1 style="font-size:72px">${pts}</h1><p>${i + 1} of ${rows.length}</p><h2>Thank you.</h2></div>`;
      return;
    }
    if (state.phase === "rules") {
      view.innerHTML = `<div class="center"><h1>Rules</h1><ol class="rules">${RULES.map((r) => `<li>${esc(r)}</li>`).join("")}</ol></div>`;
      return;
    }
    view.innerHTML = `<div class="center"><h1>You're in.</h1><p>Questions will appear here.</p></div>`;
  }

  function loginView() {
    let tries = 0;
    view.innerHTML = `<div class="center"><h1>Log in</h1>
      <div class="label">Hint</div><div class="hint">${esc(HINT)}</div>${PASSWORD_NOTE ? `<p>${esc(PASSWORD_NOTE)}</p>` : ""}
      <form class="field" id="f"><input id="pw" type="text" autocomplete="off" autocapitalize="none" spellcheck="false" maxlength="60" placeholder="Password">
      <p class="err" id="err"></p><button class="primary">Log in</button></form></div>`;
    const f = document.getElementById("f"), pw = document.getElementById("pw"), err = document.getElementById("err");
    pw.oninput = () => { busy = true; };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const guess = pw.value.trim().slice(0, 60);
      if (!guess) return;
      const ok = (await sha256(guess)) === PASSWORD_SHA256;
      push(ref(db, "attempts"), { uid, guess: ok ? "" : guess, ok, t: Date.now() }).catch(() => {});
      if (ok) { unlocked = true; store.set("unlocked", "1"); busy = false; shown = ""; render(); return; }
      tries++;
      err.textContent = tries > 1 ? `Wrong (${tries})` : "Wrong";
      f.classList.remove("shake"); void f.offsetWidth; f.classList.add("shake");
      pw.value = ""; pw.focus();
    };
  }

  function nameView() {
    view.innerHTML = `<div class="center"><h1>Your name</h1><p>Shown next to your answers.</p>
      <form class="field" id="f"><input id="name" maxlength="24" autocomplete="given-name" placeholder="Name">
      <p class="err" id="err"></p><button class="primary" id="go">Continue</button></form></div>`;
    const f = document.getElementById("f"), inp = document.getElementById("name");
    inp.oninput = () => { busy = true; };
    f.onsubmit = async (e) => {
      e.preventDefault();
      const name = inp.value.trim().slice(0, 24);
      if (!name) return;
      document.getElementById("go").disabled = true;
      try { await set(ref(db, `players/${uid}`), { name, t: Date.now() }); busy = false; shown = ""; render(); }
      catch { document.getElementById("err").textContent = "Couldn't save. Try again."; document.getElementById("go").disabled = false; }
    };
  }
  // Subscribe last, so everything render() uses already exists.
  onValue(ref(db, "state"), (s) => { state = s.val() || { phase: "login", q: 0 }; editing = false; render(); });
  onValue(ref(db, "players"), (s) => { players = s.val() || {}; render(); });
  onValue(ref(db, "answers"), (s) => { answers = s.val() || {}; render(); });
}
</script>
</body>
</html>
