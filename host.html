<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Thanksgiving Host</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;600;700&family=Young+Serif&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="app" style="height:100%"><div class="msg">Loading…</div></div>
<div class="ctrl" id="ctrl" hidden>
  <button id="prev" title="Left arrow">◀ Back</button>
  <button id="next" class="go" title="Right arrow or space">Next ▶</button>
  <button id="reset">New game</button>
</div>
<script type="module">
import { configured, connect, QUESTIONS, HINT, esc, ref, onValue, set, get, update } from "./common.js";
const app = document.getElementById("app");
const JOIN_URL = location.href.replace(/host\.html.*$/, "").replace(/[?#].*$/, "");
const JOIN = JOIN_URL.replace(/^https?:\/\//, "").replace(/\/$/, "");

if (!configured) {
  app.innerHTML = `<div class="msg">Firebase isn't configured yet. Paste the config into <code>config.js</code>.</div>`;
} else {
  const { db, uid } = await connect();
  const cfg = (await get(ref(db, "config/hostUid"))).val();
  if (!cfg) await set(ref(db, "config/hostUid"), uid);
  const isHost = !cfg || cfg === uid;   // other browsers can still mirror the screen, without controls

  let state = { phase: "login", q: 0 }, players = {}, answers = {}, attempts = {};
  onValue(ref(db, "state"), (s) => { state = s.val() || { phase: "login", q: 0 }; render(); });
  onValue(ref(db, "players"), (s) => { players = s.val() || {}; render(); });
  onValue(ref(db, "answers"), (s) => { answers = s.val() || {}; render(); });
  onValue(ref(db, "attempts"), (s) => { attempts = s.val() || {}; render(); });

  // Order: login screen, each question, end screen.
  const setState = (p) => isHost && set(ref(db, "state"), { ...state, ...p });
  function next() {
    if (state.phase === "login") setState({ phase: "question", q: 0 });
    else if (state.phase === "question") state.q + 1 < QUESTIONS.length ? setState({ q: state.q + 1 }) : setState({ phase: "end" });
  }
  function prev() {
    if (state.phase === "end") setState({ phase: "question", q: QUESTIONS.length - 1 });
    else if (state.phase === "question") state.q > 0 ? setState({ q: state.q - 1 }) : setState({ phase: "login" });
  }
  let armed = false;
  async function reset() {
    const b = document.getElementById("reset");
    if (!armed) { armed = true; b.textContent = "Erase all guesses, names and answers? Click again"; setTimeout(() => { armed = false; b.textContent = "New game"; }, 4000); return; }
    armed = false; b.textContent = "New game";
    await update(ref(db), { answers: null, players: null, attempts: null, state: { phase: "login", q: 0 } });
  }
  if (isHost) {
    document.getElementById("ctrl").hidden = false;
    document.getElementById("next").onclick = next;
    document.getElementById("prev").onclick = prev;
    document.getElementById("reset").onclick = reset;
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") prev();
      else if (e.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
    });
  }

  function qr(el, size) {
    el.innerHTML = "";
    if (window.QRCode) new QRCode(el, { text: JOIN_URL, width: size, height: size, colorDark: "#2b0711", colorLight: "#ffffff" });
  }
  // A guest is "Guest 3" until they pick a name; then every earlier guess shows their name too.
  function labeler(list) {
    const order = [];
    for (const a of list) if (!order.includes(a.uid)) order.push(a.uid);
    return (id) => players[id]?.name || `Guest ${order.indexOf(id) + 1}`;
  }
  const joinStrip = () => `<div class="join"><div class="url">Join at<br>${esc(JOIN)}</div><div class="qr" id="qr"></div></div>`;

  let lastKey = "";
  function render() {
    const key = state.phase + ":" + state.q;
    const fresh = key !== lastKey;
    lastKey = key;

    if (state.phase === "login") {
      const list = Object.values(attempts).sort((a, b) => a.t - b.t);
      const name = labeler(list);
      const inCount = new Set(list.filter((a) => a.ok).map((a) => a.uid)).size;
      if (fresh) {
        app.innerHTML = `<div class="stage">
          <div class="top"><div><div class="kick">Step one: get in</div><h1>Can you crack the password?</h1><div class="sub">Hint: <b>${esc(HINT)}</b></div></div>
            <div class="tally"><div class="n" id="in">0</div><div class="t">got in · <span id="tries">0</span> guesses</div></div></div>
          <div class="wall" id="wall"></div>
          <div class="bottom">${joinStrip()}</div></div>`;
        qr(document.getElementById("qr"), Math.min(150, innerHeight * .16));
      }
      document.getElementById("in").textContent = inCount;
      document.getElementById("tries").textContent = list.length;
      const recent = list.slice(-80).reverse();
      document.getElementById("wall").innerHTML = recent.length
        ? recent.map((a) => `<div class="card ${a.ok ? "ok" : ""}"><div class="nm">${esc(name(a.uid))}</div><div class="gs">${a.ok ? "●●●●●● ✓" : esc(a.guess)}</div></div>`).join("")
        : `<div class="empty">Guesses will appear here as people try them.</div>`;
      return;
    }

    if (state.phase === "question") {
      const Q = QUESTIONS[state.q];
      const a = answers[state.q] || {};
      const list = Object.entries(a).filter(([id]) => players[id]).map(([id, v]) => ({ id, ...v })).sort((x, y) => x.t - y.t);
      if (fresh) {
        app.innerHTML = `<div class="stage">
          <div class="top"><div><div class="kick">Question ${state.q + 1} of ${QUESTIONS.length}</div><h1>${esc(Q ?? "No question here, check questions.js")}</h1></div>
            <div class="tally"><div class="n" id="n">0</div><div class="t">of <span id="tot">0</span> answered</div></div></div>
          <div class="wall answers" id="wall"></div>
          <div class="bottom"><div class="who" id="who"></div>${joinStrip()}</div></div>`;
        qr(document.getElementById("qr"), Math.min(96, innerHeight * .1));
      }
      document.getElementById("n").textContent = list.length;
      document.getElementById("tot").textContent = Object.keys(players).length;
      const wall = document.getElementById("wall");
      if (!list.length) wall.innerHTML = `<div class="empty">Answers will appear here.</div>`;
      else {
        // Update cards in place so only new or changed answers animate.
        wall.querySelector(".empty")?.remove();
        const have = new Map([...wall.querySelectorAll(".card")].map((c) => [c.dataset.id, c]));
        for (const r of list) {
          const old = have.get(r.id);
          have.delete(r.id);
          if (old && old.dataset.sig === String(r.t)) continue;
          old?.remove();
          const c = document.createElement("div");
          c.className = "card"; c.dataset.id = r.id; c.dataset.sig = String(r.t);
          c.innerHTML = `<div class="nm"></div><div class="gs"></div>`;
          c.querySelector(".nm").textContent = players[r.id].name;
          c.querySelector(".gs").textContent = r.text;
          wall.append(c);
        }
        for (const c of have.values()) c.remove();
      }
      document.getElementById("who").innerHTML = Object.entries(players).sort((x, y) => x[1].t - y[1].t)
        .map(([id, p]) => `<span class="chip ${id in a ? "on" : ""}">${esc(p.name)}</span>`).join("");
      return;
    }

    if (fresh) app.innerHTML = `<div class="stage" style="grid-template-rows:1fr"><div style="margin:auto;text-align:center"><div class="kick">That's everything</div><h1 style="font-size:clamp(48px,7vw,120px);max-width:none">Happy Thanksgiving</h1></div></div>`;
  }
  render();
}
</script>
</body>
</html>
