<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Navanax</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=6">
<link rel="preload" as="image" href="navanax.jpg">
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
</head>
<body>
<div id="app" style="height:100%"><div class="msg">Loading…</div></div>
<div class="ctrl" id="ctrl" hidden>
  <button id="prev" title="Left arrow">Back</button>
  <button id="next" title="Right arrow or space">Next</button>
  <button id="reset">New game</button>
</div>
<script>setTimeout(()=>{const b=document.getElementById("app");if(b&&/^\s*Loading/.test(b.textContent))b.innerHTML='<p class="center msg">Still loading. <a href="" style="color:inherit">Tap to reload</a>.</p>'},12000)</script>
<script type="module">
addEventListener("unhandledrejection", (e) => { const m = String(e.reason?.message || e.reason); const box = document.getElementById("app"); if (box && /loading/i.test(box.textContent)) box.innerHTML = `<div class="msg">Can't reach the database.<br><small>${m.replace(/</g, "&lt;")}</small></div>`; });
import { configured, connect, QUESTIONS, HINT, esc, hasReveal, parseNum, fmtNum, seatsSVG, correctSet, scoreboard, isScored, revealedCount, ref, onValue, set, get, update } from "./common.js?v=6";
const app = document.getElementById("app");
const JOIN_URL = location.href.replace(/host\.html.*$/, "").replace(/[?#].*$/, "");
const JOIN = JOIN_URL.replace(/^https?:\/\//, "").replace(/\/$/, "");

if (!configured) {
  app.innerHTML = `<div class="msg">Firebase isn't configured.</div>`;
} else {
  const { db, uid } = await connect();
  const cfg = (await get(ref(db, "config/hostUid"))).val();
  if (!cfg) await set(ref(db, "config/hostUid"), uid);
  const isHost = !cfg || cfg === uid;   // other browsers can mirror the screen, without controls

  let state = { phase: "login", q: 0 }, players = {}, answers = {}, attempts = {}, lastKey = "", showBoard = false;

  // login → each question (→ its reveal, if it has one) → scores → end
  const setState = (p) => isHost && set(ref(db, "state"), { ...state, ...p });
  const enter = (q) => setState({ phase: "question", q });
  function next() {
    const Q = QUESTIONS[state.q];
    if (state.phase === "login") enter(0);
    else if (state.phase === "question" && hasReveal(Q)) setState({ phase: "reveal" });
    else if (state.phase === "question" || state.phase === "reveal") state.q + 1 < QUESTIONS.length ? enter(state.q + 1) : setState({ phase: "scores" });
    else if (state.phase === "scores") setState({ phase: "end" });
  }
  function prev() {
    const last = QUESTIONS.length - 1;
    const back = (q) => setState({ phase: hasReveal(QUESTIONS[q]) ? "reveal" : "question", q });
    if (state.phase === "end") setState({ phase: "scores" });
    else if (state.phase === "scores") back(last);
    else if (state.phase === "reveal") setState({ phase: "question" });
    else if (state.phase === "question") state.q > 0 ? back(state.q - 1) : setState({ phase: "login" });
  }
  let armed = false;
  async function reset() {
    const b = document.getElementById("reset");
    if (!armed) { armed = true; b.textContent = "Erase everything? Click again"; setTimeout(() => { armed = false; b.textContent = "New game"; }, 4000); return; }
    armed = false; b.textContent = "New game";
    await update(ref(db), { answers: null, players: null, attempts: null, state: { phase: "login", q: 0 } });
  }
  if (isHost) {
    document.getElementById("ctrl").hidden = false;
    document.getElementById("next").onclick = next;
    document.getElementById("prev").onclick = prev;
    document.getElementById("reset").onclick = reset;
    addEventListener("keydown", (e) => {
      if (e.key === "ArrowRight" || e.key === "PageDown" || e.key === " ") { e.preventDefault(); next(); }
      else if (e.key === "ArrowLeft" || e.key === "PageUp") prev();
      else if (e.key === "f") document.documentElement.requestFullscreen?.().catch(() => {});
      else if (e.key === "s") { showBoard = !showBoard; lastKey = ""; render(); }
    });
  }

  // On a reveal screen, clicking an answer flips it between right and wrong.
  app.addEventListener("click", (e) => {
    const el = e.target.closest("[data-id]");
    const Q = QUESTIONS[state.q];
    if (!isHost || !el || state.phase !== "reveal" || !isScored(Q)) return;
    const id = el.dataset.id, k = "q" + state.q;
    const now = correctSet(Q, state.q, answers, state.marks).has(id);
    const marks = { ...(state.marks || {}) };
    marks[k] = { ...(marks[k] || {}), [id]: !now };
    setState({ marks });
  });

  function qr(size) {
    const el = document.getElementById("qr");
    if (!el || !window.QRCode) return;
    el.innerHTML = "";
    new QRCode(el, { text: JOIN_URL, width: size, height: size, colorDark: "#000000", colorLight: "#ffffff" });
  }
  const joinStrip = () => `<div class="join"><div class="url">Join at<br><b>${esc(JOIN)}</b></div><div class="qr" id="qr"></div></div>`;
  const nameOf = (id) => players[id]?.name || "Guest";

  // Histogram of numeric guesses. Log questions bin by power of ten.
  function histogram(Q, list, reveal, wins) {
    const log = Q.scale === "log";
    const tx = (v) => (log ? (v > 0 ? Math.log10(v) : NaN) : v);
    const pts = list.map((r) => ({ ...r, v: parseNum(r.text) })).map((r) => ({ ...r, x: tx(r.v) })).filter((r) => isFinite(r.x));
    const ans = Q.answer !== undefined ? tx(Q.answer) : NaN;
    const xs = pts.map((r) => r.x).concat(reveal && isFinite(ans) ? [ans] : []);
    if (!xs.length) return `<div class="empty">Guesses will appear here.</div>`;
    const lo = Math.min(...xs), hi = Math.max(...xs);
    const raw = Math.max(hi - lo, 1) / 14, pow = 10 ** Math.floor(Math.log10(raw));
    const step = Math.max(1, [1, 2, 5, 10].map((m) => m * pow).find((s) => s >= raw));
    const start = Math.floor(lo / step) * step;
    const n = Math.floor((hi - start) / step) + 1;
    const bin = (x) => Math.min(n - 1, Math.floor((x - start) / step));
    const cols = Array.from({ length: n }, () => []);
    for (const r of pts) cols[bin(r.x)].push(r);
    const max = Math.max(3, ...cols.map((c) => c.length));
    const hit = reveal && isFinite(ans) ? bin(ans) : -1;
    const lab = (i) => {
      const k = start + i * step;
      if (log) return step === 1 ? `10<sup>${k}</sup>` : `10<sup>${k}–${k + step - 1}</sup>`;
      return step === 1 ? `${k}` : `${k}–${k + step - 1}`;
    };
    const every = n > 24 ? Math.ceil(n / 12) : 1;
    let closest = "";
    const winners = pts.filter((r) => wins.has(r.id));
    if (reveal && winners.length) closest = `<div class="closest">Point to ${winners.map((w) => `<b>${esc(nameOf(w.id))}</b> (${esc(fmtNum(w.v))})`).join(", ")}</div>`;
    return `<div class="hist"><div class="cols" style="--max:${max}">${cols.map((c, i) => `
      <div class="col ${i === hit ? "hit" : ""}">${c.map((r) => `<div class="blk ${wins.has(r.id) ? "win" : ""}" data-id="${esc(r.id)}" title="${esc(r.text)}">${esc(nameOf(r.id))}</div>`).join("")}
      ${i === hit ? `<div class="flag"><span>${esc(Q.answerLabel || fmtNum(Q.answer))}</span></div>` : ""}</div>`).join("")}</div>
      <div class="xs">${cols.map((_, i) => `<div>${i % every === 0 ? lab(i) : ""}</div>`).join("")}</div></div>${closest}`;
  }

  // Text answers: update cards in place so only new or changed ones animate.
  function fillWall(list, wins) {
    const wall = document.getElementById("wall");
    if (!wall) return;
    if (wins) wall.classList.add("judging");
    if (!list.length) { wall.innerHTML = `<div class="empty">Answers will appear here.</div>`; return; }
    wall.querySelector(".empty")?.remove();
    const have = new Map([...wall.querySelectorAll(".card")].map((c) => [c.dataset.id, c]));
    for (const r of list) {
      const old = have.get(r.id);
      have.delete(r.id);
      if (old && old.dataset.sig === String(r.t)) continue;
      old?.remove();
      const c = document.createElement("div");
      c.className = "card"; c.dataset.id = r.id; c.dataset.sig = String(r.t);
      c.innerHTML = `<div class="nm"></div><div class="gs"></div>`;
      c.querySelector(".nm").textContent = nameOf(r.id);
      c.querySelector(".gs").textContent = r.text;
      wall.append(c);
    }
    for (const c of have.values()) c.remove();
    if (wins) for (const c of wall.querySelectorAll(".card")) c.classList.toggle("ok", wins.has(c.dataset.id));
  }

  // Small top-five leaderboard in the corner during play, once anything has been scored.
  function miniBoard() {
    const el = document.getElementById("lb");
    if (!el) return;
    const scored = QUESTIONS.slice(0, revealedCount(state, QUESTIONS)).some(isScored);
    const rows = scored ? scoreboard(QUESTIONS, state, players, answers).slice(0, 5) : [];
    el.innerHTML = rows.length ? `<div class="lbh">Leaderboard</div>` + rows.map((r, i) =>
      `<div class="lbr"><span class="lbn">${i + 1}</span><span class="lbm">${esc(r.name)}</span><span class="lbp">${r.pts}</span></div>`).join("") : "";
  }

  function boardHTML() {
    const rows = scoreboard(QUESTIONS, state, players, answers);
    const cols = QUESTIONS.map((Q, i) => (isScored(Q) ? i : -1)).filter((i) => i >= 0);
    return `<div class="stage" style="grid-template-rows:auto minmax(0,1fr)">
      <div class="top"><div><div class="label">Navanax</div><h1>Scoreboard</h1></div></div>
      <div class="board-wrap"><table class="board"><thead><tr><th></th><th></th>${cols.map((i) => `<th>${i + 1}</th>`).join("")}<th>Total</th></tr></thead>
      <tbody>${rows.map((r, n) => `<tr style="animation-delay:${n * 70}ms"><td class="rk">${n === 0 || r.pts !== rows[n - 1].pts ? n + 1 : ""}</td><td class="nm">${esc(r.name)}</td>
        ${cols.map((i) => `<td class="mk">${r.marks[i] === true ? "✓" : r.marks[i] === false ? "·" : ""}</td>`).join("")}<td class="pts">${r.pts}</td></tr>`).join("")
        || `<tr><td></td><td class="nm">No players yet</td></tr>`}</tbody></table></div></div>`;
  }

  function render() {
    if (showBoard || state.phase === "scores") { app.innerHTML = boardHTML(); lastKey = "board"; return; }
    const key = state.phase + ":" + state.q;
    const fresh = key !== lastKey;
    lastKey = key;

    if (state.phase === "login") {
      const list = Object.values(attempts).sort((a, b) => a.t - b.t);
      const order = [...new Set(list.map((a) => a.uid))];
      const who = (id) => players[id]?.name || `Guest ${order.indexOf(id) + 1}`;
      if (fresh) {
        app.innerHTML = `<div class="stage">
          <div class="top"><div><div class="label">Navanax</div><h1>Log in</h1><div class="sub">Hint: <b>${esc(HINT)}</b></div></div>
            <div class="tally"><div class="n" id="in">0</div><div class="t">in · <span id="tries">0</span> attempts</div></div></div>
          <div class="wall" id="wall"></div>
          <div class="bottom">${joinStrip()}</div></div>`;
        qr(Math.min(140, innerHeight * .15));
      }
      document.getElementById("in").textContent = new Set(list.filter((a) => a.ok).map((a) => a.uid)).size;
      document.getElementById("tries").textContent = list.length;
      document.getElementById("wall").innerHTML = list.length
        ? list.slice(-80).reverse().map((a) => `<div class="card ${a.ok ? "ok" : ""}"><div class="nm">${esc(who(a.uid))}</div><div class="gs">${a.ok ? "●●●●●● ✓" : esc(a.guess)}</div></div>`).join("")
        : `<div class="empty">Attempts will appear here.</div>`;
      return;
    }

    if (state.phase === "question" || state.phase === "reveal") {
      const Q = QUESTIONS[state.q];
      if (!Q) { app.innerHTML = `<div class="msg">No question ${state.q + 1}.</div>`; return; }
      const reveal = state.phase === "reveal";
      const a = answers[state.q] || {};
      const list = Object.entries(a).filter(([id]) => players[id]).map(([id, v]) => ({ id, ...v })).sort((x, y) => x.t - y.t);
      const num = Q.type === "number";
      const extra = Q.figure === "seats" ? seatsSVG() : Q.quote ? `<blockquote>${esc(Q.quote.text)}<cite>${esc(Q.quote.cite)}</cite></blockquote>` : "";

      if (fresh) {
        let body;
        if (reveal && Q.reveal) {
          const R = Q.reveal;
          body = `<div class="revealwrap"><div class="reveal ${R.image ? "" : "solo"}">${R.image ? `<img src="${esc(R.image)}" alt="">` : ""}
            <div><div class="big">${esc(R.text || "")}</div>${R.caption ? `<div class="cap">${esc(R.caption)}</div>` : ""}</div></div>
            <div class="wall answers mini" id="wall"></div></div>`;
        } else if (num) {
          body = extra ? `<div class="split" style="grid-template-columns:minmax(0,1fr) minmax(0,2fr)"><div style="align-self:center">${extra}</div><div class="histbox" id="hist"></div></div>` : `<div class="histbox" id="hist"></div>`;
        } else {
          body = extra ? `<div class="split">${extra}<div class="wall answers" id="wall" style="align-content:flex-start"></div></div>` : `<div class="wall answers" id="wall"></div>`;
        }
        app.innerHTML = `<div class="stage">
          <div class="top"><div><div class="label">${state.q + 1} / ${QUESTIONS.length}</div><h1>${esc(Q.q)}</h1></div>
            <div class="tally"><div class="n" id="n">0</div><div class="t">of <span id="tot">0</span> answered</div></div></div>
          ${body}
          <div class="bottom"><div class="lb" id="lb"></div>${joinStrip()}</div></div>`;
        qr(Math.min(84, innerHeight * .09));
      }
      document.getElementById("n").textContent = list.length;
      document.getElementById("tot").textContent = Object.keys(players).length;
      const hist = document.getElementById("hist");
      const wins = reveal && isScored(Q) ? correctSet(Q, state.q, answers, state.marks) : null;
      if (hist) hist.innerHTML = histogram(Q, list, reveal, wins || new Set());
      fillWall(list, wins);
      miniBoard();
      return;
    }

    if (fresh) app.innerHTML = `<div class="stage" style="grid-template-rows:1fr"><h1 style="margin:auto;font-size:clamp(56px,9vw,160px)">Navanax</h1></div>`;
  }
  // Subscribe last, so everything render() uses already exists.
  onValue(ref(db, "state"), (s) => { state = s.val() || { phase: "login", q: 0 }; render(); });
  onValue(ref(db, "players"), (s) => { players = s.val() || {}; render(); });
  onValue(ref(db, "answers"), (s) => { answers = s.val() || {}; render(); });
  onValue(ref(db, "attempts"), (s) => { attempts = s.val() || {}; render(); });
}
</script>
</body>
</html>
